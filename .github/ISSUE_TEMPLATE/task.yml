name: Technical task
description: New scoped work requiring plan registration
title: "[WP][Phase] "
labels: ["type:task"]
body:
  - type: textarea
    id: scope
    attributes:
      label: Objective, contracts and affected paths
    validations:
      required: true
  - type: textarea
    id: ownership
    attributes:
      label: Plan ID, primary owner, supporting developer, independent reviewer
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Prerequisites, dates, effort range and P0/P1
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Deliverables, tests, documentation and definition of done
      description: Register this task in the reviewed main task-plan before its implementation PR.
    validations:
      required: true
