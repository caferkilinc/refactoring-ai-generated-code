name: Java pilot checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pilot-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.4+7.0.LTS'
      - name: Install pinned Maven from Maven Central
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/apache-maven-3.9.11-bin.tar.gz"
          curl --fail --silent --show-error --location --retry 2 --max-time 120 \
            https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.11/apache-maven-3.9.11-bin.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            'bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978' \
            "$archive" | sha512sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.11/bin" >> "$GITHUB_PATH"
      - name: Record runtime and verify original artifacts
        run: |
          java -version
          mvn -version
          python3 experiments/java-pilot/verify_integrity.py
      - name: Compile and execute fixed JUnit regression tests
        run: python3 -B experiments/java-pilot/reproduce.py
      - name: Verify original and test integrity after execution
        if: always()
        run: python3 experiments/java-pilot/verify_integrity.py
