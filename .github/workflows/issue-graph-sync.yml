name: Issue graph sync
on:
  push:
    branches: ['chore/1-team-workflow']
    paths: ['.github/task-plan.json', 'scripts/governance/sync_issues.py', '.github/workflows/issue-graph-sync.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  sync:
    if: github.actor == github.repository_owner && (github.ref == 'refs/heads/chore/1-team-workflow' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Synchronize existing issues without deletions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/governance/sync_issues.py
