name: Dependency gate
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
jobs:
  dependency-gate:
    runs-on: ubuntu-24.04
    steps:
      # Trusted BASE revision only. Never checkout or execute PR head code here.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Check trusted task scope and accepted prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/governance/gate.py --pr "$PR_NUMBER"
