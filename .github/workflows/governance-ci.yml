name: Governance CI
on:
  push:
    branches: [main, 'chore/1-team-workflow']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  governance-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests/governance -v
  documentation-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/governance/check_docs.py
  security-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/governance/security_check.py
