name: Governance CI
on:
  push:
    branches: [main, 'chore/1-team-workflow', 'chore/project-genesis-v2-migration']
  pull_request:
    branches: [main, 'chore/1-team-workflow', 'chore/project-genesis-v2-migration']
permissions:
  contents: read
concurrency:
  group: governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  governance-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests/governance -v
  documentation-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 scripts/governance/check_docs.py
  security-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 scripts/governance/security_check.py
  dependency-gate-preview:
    # Read-only preview for this bootstrap PR; main's gate cannot exist before merge.
    if: github.event_name == 'push' && github.ref == 'refs/heads/chore/1-team-workflow' && github.actor == github.repository_owner
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Read-only bootstrap PR verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/governance/gate.py --pr 38
      - name: Read-only live issue consistency audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/governance/audit_plan.py
